# Apache vhost — zahtijeva mod_headers, mod_setenvif
# sudo a2enmod headers setenvif && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName mojaapp.hr
    DocumentRoot /var/www/mojaapp/public

    # === BOT PROTECTION ===
    SetEnvIf User-Agent "GPTBot"             bad_bot
    SetEnvIf User-Agent "ChatGPT-User"       bad_bot
    SetEnvIf User-Agent "OAI-SearchBot"      bad_bot
    SetEnvIf User-Agent "ClaudeBot"          bad_bot
    SetEnvIf User-Agent "anthropic-ai"       bad_bot
    SetEnvIf User-Agent "Claude-Web"         bad_bot
    SetEnvIf User-Agent "Google-Extended"    bad_bot
    SetEnvIf User-Agent "Googlebot"          bad_bot
    SetEnvIf User-Agent "Meta-ExternalAgent" bad_bot
    SetEnvIf User-Agent "FacebookBot"        bad_bot
    SetEnvIf User-Agent "Applebot"           bad_bot
    SetEnvIf User-Agent "Amazonbot"          bad_bot
    SetEnvIf User-Agent "PerplexityBot"      bad_bot
    SetEnvIf User-Agent "Bytespider"         bad_bot
    SetEnvIf User-Agent "CCBot"              bad_bot
    SetEnvIf User-Agent "cohere-ai"          bad_bot
    SetEnvIf User-Agent "MistralAI-User"     bad_bot
    SetEnvIf User-Agent "SemrushBot"         bad_bot
    SetEnvIf User-Agent "AhrefsBot"          bad_bot
    SetEnvIf User-Agent "MJ12bot"            bad_bot
    SetEnvIf User-Agent "YandexBot"          bad_bot
    SetEnvIf User-Agent "Baiduspider"        bad_bot
    SetEnvIf User-Agent "Scrapy"             bad_bot

    <Directory /var/www/mojaapp/public>
        AllowOverride All
        Require all granted

        # Apache 2.4+ syntax
        <RequireAll>
            Require all granted
            Require not env bad_bot
        </RequireAll>
    </Directory>

    Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet"

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>
</VirtualHost>
