# /etc/nginx/conf.d/bot-protection.conf
#
# Staviti JEDNOM u http {} kontekst — obično u /etc/nginx/conf.d/
# Svaki vhost zatim samo referencira $blocked_bot varijablu.
# NE stavljati unutar server {} ili location {} bloka.

map $http_user_agent $blocked_bot {
    default 0;

    # OpenAI
    "~*GPTBot"              1;
    "~*ChatGPT-User"        1;
    "~*OAI-SearchBot"       1;

    # Anthropic
    "~*ClaudeBot"           1;
    "~*anthropic-ai"        1;
    "~*Claude-Web"          1;

    # Google AI & Search
    "~*Google-Extended"     1;
    "~*Googlebot"           1;
    "~*AdsBot-Google"       1;

    # Meta
    "~*Meta-ExternalAgent"  1;
    "~*FacebookBot"         1;

    # Apple
    "~*Applebot"            1;

    # Amazon
    "~*Amazonbot"           1;

    # Perplexity
    "~*PerplexityBot"       1;

    # ByteDance
    "~*Bytespider"          1;

    # Common Crawl
    "~*CCBot"               1;

    # Cohere, Mistral
    "~*cohere-ai"           1;
    "~*MistralAI-User"      1;

    # SEO crawleri
    "~*SemrushBot"          1;
    "~*AhrefsBot"           1;
    "~*MJ12bot"             1;

    # Yandex, Baidu
    "~*YandexBot"           1;
    "~*Baiduspider"         1;

    # Generički scraperi
    "~*Scrapy"              1;
}
