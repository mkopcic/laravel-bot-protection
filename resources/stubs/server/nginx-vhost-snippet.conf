# Dodati unutar svakog server {} bloka Laravel appa.
# Preduvjet: nginx-shared-map.conf učitan u http {} kontekst.

server {
    listen 80;
    listen 443 ssl;
    server_name mojaapp.hr www.mojaapp.hr;

    root /var/www/mojaapp/public;
    index index.php;

    # === BOT PROTECTION ===
    if ($blocked_bot) {
        return 403;
    }

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # === Laravel standard ===
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
